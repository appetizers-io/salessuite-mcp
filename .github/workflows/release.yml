# Publishes to npm via trusted publishing (OIDC, no token): https://docs.npmjs.com/trusted-publishers
# Release: `npm version <patch|minor|major>` on main, then push the commit and tag (`git push --follow-tags`).
name: Release

on:
  push:
    tags: ['v*']

# One group per tag: a shared group would cancel pending runs when several tags are pushed at once.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    # Trusted publishing requires GitHub-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: npm >= 11.5.1 (required for trusted publishing; provenance is generated automatically for public repos)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" || npm install -g npm@11

      - run: npm ci
      - run: npm run build

      - name: Publish to npm
        run: npm publish --access public

  # Separate job so it can be re-run without publishing the same npm version again.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
